<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#6b9fc4" stroke-opacity=".1" stroke-width=".7"/></pattern>
<pattern id="window" width="32" height="37" patternUnits="userSpaceOnUse"><rect x="8" y="7" width="10" height="18" fill="#75A4BD" opacity=".22"/></pattern>
