<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" role="img" aria-labelledby="title description">
<title id="title">Ночной район Eastwell</title><desc id="description">Стилизованный городской пейзаж: здания, светящиеся окна и автомобиль на проспекте.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#0D2445"/><stop offset="1" stop-color="#070F21"/></linearGradient>
<linearGradient id="wall" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#285378"/><stop offset=".95" stop-color="#10223F"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#192A41"/><stop offset="1" stop-color="#0B1425"/></linearGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#6b9fc4" stroke-opacity=".1" stroke-width=".7"/></pattern>
<pattern id="window" width="32" height="37" patternUnits="userSpaceOnUse"><rect x="8" y="7" width="10" height="18" fill="#75A4BD" opacity=".22"/></pattern>
</defs>
<style>
@keyframes roll{from{transform:translateX(-330px)}to{transform:translateX(930px)}}@keyframes pulse{50%{opacity:.35}}@keyframes windowlight{50%{opacity:.22}}@keyframes scan{to{transform:translateX(800px)}}
#car{animation:roll 16s linear infinite}#beacon{animation:pulse 2.4s ease-in-out infinite}.warm-window{animation:windowlight 6s ease-in-out infinite}#scan{animation:scan 10s linear infinite}
@media(prefers-reduced-motion:reduce){#car,#beacon,.warm-window,#scan{animation:none}#car{transform:translateX(180px)}}
</style>
